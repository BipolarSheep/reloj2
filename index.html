<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reloj</title>
<style>
  :root{
    --tinta:#f2f2f2;
    --tenue:rgba(242,242,242,.62);
    --apagado:rgba(242,242,242,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    background:#000;
    color:var(--tinta);
    font-family:"Google Sans","Roboto","Noto Sans","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }
  #app{position:fixed;inset:0}
  .capa{position:absolute;inset:0;display:none}
  .capa.visible{display:block}

  /* ---------- 1. Pantalla apagada ---------- */
  #rejilla{
    position:absolute;left:0;right:0;bottom:0;height:50%;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  }
  #rejilla div{width:100%;height:100%}
  body.depurar #rejilla div{
    outline:1px dashed rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;color:rgba(255,255,255,.45)
  }
  body.depurar #rejilla div::after{content:attr(data-n)}

  /* ---------- 2. Pantalla de bloqueo ---------- */
  #bloqueo{
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #barra{
    position:absolute;top:0;left:0;right:0;height:30px;
    display:flex;align-items:center;justify-content:flex-end;gap:7px;
    padding:0 16px;font-size:12px;color:var(--tenue);
  }
  #barra svg{display:block}
  #bateriaTexto{font-size:12px;letter-spacing:.2px}

  #candado{
    position:absolute;top:calc(30px + 5vh);left:0;right:0;
    display:flex;justify-content:center;color:var(--apagado);
  }
  #reloj{
    position:absolute;top:0;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:translateY(-6vh);
  }
  #hora{
    font-size:clamp(76px,23vw,148px);
    font-weight:200;
    line-height:1;
    letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }
  #fecha{
    margin-top:14px;
    font-size:clamp(15px,4.2vw,18px);
    font-weight:400;
    letter-spacing:.2px;
    color:var(--tenue);
  }
  #inferior{
    position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;padding:0 34px;
  }
  .boton-redondo{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.09);
    display:flex;align-items:center;justify-content:center;
    color:var(--tenue);
  }
  #barrita{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(9px + env(safe-area-inset-bottom));
    width:108px;height:4px;border-radius:2px;background:rgba(255,255,255,.32);
  }
  #zonaTruco{position:absolute;top:23%;left:0;right:0;height:36%;z-index:5}
  body.depurar #zonaTruco{outline:1px dashed rgba(0,200,255,.5)}

  #pista{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;font-size:14px;letter-spacing:.3px;
    color:rgba(242,242,242,.20);
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">

  <!-- 0. PREPARAR: el primer toque solo pide pantalla completa -->
  <section id="preparar" class="capa visible">
    <div id="pista">toca para preparar</div>
  </section>

  <!-- 1. APAGADA: rejilla invisible 3x3 -->
  <section id="apagada" class="capa">
    <div id="rejilla"></div>
  </section>

  <!-- 2. BLOQUEO -->
  <section id="bloqueo" class="capa">
    <div id="barra">
      <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor" aria-hidden="true"><path d="M7.5 11.4 0 3.3A10.6 10.6 0 0 1 7.5 0 10.6 10.6 0 0 1 15 3.3Z"/></svg>
      <svg width="13" height="12" viewBox="0 0 13 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="2.4" height="4" rx=".6"/><rect x="3.5" y="5.5" width="2.4" height="6.5" rx=".6"/><rect x="7" y="3" width="2.4" height="9" rx=".6"/><rect x="10.5" y="0" width="2.4" height="12" rx=".6"/></svg>
      <span id="bateriaTexto">86%</span>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none" aria-hidden="true">
        <rect x=".6" y=".6" width="18" height="9.8" rx="2.4" stroke="currentColor" stroke-width="1.1"/>
        <rect id="bateriaNivel" x="2.1" y="2.1" width="12.5" height="6.8" rx="1.3" fill="currentColor"/>
        <path d="M20.4 3.9v3.2a2.1 2.1 0 0 0 0-3.2Z" fill="currentColor"/>
      </svg>
    </div>

    <div id="candado">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.6"/>
        <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/>
      </svg>
    </div>

    <div id="reloj">
      <div id="hora">00:00</div>
      <div id="fecha">—</div>
    </div>

    <div id="inferior">
      <div class="boton-redondo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M9 5.5h6l1.2 2.2H20a1.6 1.6 0 0 1 1.6 1.6v8.6A1.6 1.6 0 0 1 20 19.5H4a1.6 1.6 0 0 1-1.6-1.6V9.3A1.6 1.6 0 0 1 4 7.7h3.8Z"/>
          <circle cx="12" cy="13.2" r="3.4"/>
        </svg>
      </div>
      <div class="boton-redondo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M8.6 3.5h6.8l-.7 5.2a4.6 4.6 0 0 1 1.1 3v9a1.8 1.8 0 0 1-1.8 1.8h-4a1.8 1.8 0 0 1-1.8-1.8v-9a4.6 4.6 0 0 1 1.1-3Z"/>
          <path d="M9.4 13.6h5.2"/>
        </svg>
      </div>
    </div>
    <div id="barrita"></div>

    <div id="zonaTruco"></div>
  </section>

</div>

<script>
(function(){
  "use strict";

  /* ================== AJUSTES DEL TRUCO ================== */
  const CONFIG = {
    msPorMinuto: 700,      // ritmo del retroceso
    vibracion: 40,         // ms de micro-vibración por minuto
    vibracionConfirmacion: 25,   // aviso al confirmar que el número quedó cargado
    rejillaPantallaCompleta: false, // true = las 9 zonas ocupan toda la pantalla
    formato24h: true,      // false = formato de 12 h (sin AM/PM, como Android)
    mostrarBarraEstado: true,
    mostrarIconosAbajo: true,
    pausaAntesDeEmpezar: 450 // respiro tras el toque, antes del primer salto
  };
  /* ======================================================= */

  const $ = s => document.querySelector(s);
  const preparar = $('#preparar'), apagada = $('#apagada'), bloqueo = $('#bloqueo');
  const elHora = $('#hora'), elFecha = $('#fecha');
  const depurar = /[?&]debug/.test(location.search);
  if (depurar) document.body.classList.add('depurar');
  if (!CONFIG.mostrarBarraEstado) $('#barra').style.display = 'none';
  if (!CONFIG.mostrarIconosAbajo) $('#inferior').style.display = 'none';

  let minutosElegidos = 0;   // lo que dirá el espectador que "retrocedió"
  let desfaseMs = 0;         // adelanto aplicado al reloj real (negativo = va por delante)
  let yaDisparado = false;
  let activoDesde = 0;       // ignora toques justo tras entrar en pantalla completa
  let animando = false;
  let tick = null;

  /* ---------- Reloj ---------- */
  const dosDigitos = n => String(n).padStart(2, '0');

  function textoHora(d){
    let h = d.getHours();
    if (!CONFIG.formato24h) { h = h % 12 || 12; return h + ':' + dosDigitos(d.getMinutes()); }
    return dosDigitos(h) + ':' + dosDigitos(d.getMinutes());
  }
  function textoFecha(d){
    const t = d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function pintar(d){
    elHora.textContent = textoHora(d);
    elFecha.textContent = textoFecha(d);
  }
  function iniciarTick(){
    detenerTick();
    pintar(new Date(Date.now() - desfaseMs));
    tick = setInterval(() => {
      if (!animando) pintar(new Date(Date.now() - desfaseMs));
    }, 1000);
  }
  function detenerTick(){ if (tick) { clearInterval(tick); tick = null; } }

  /* ---------- Pantalla completa + pantalla siempre encendida ---------- */
  function esAppInstalada(){
    try {
      return window.matchMedia('(display-mode: fullscreen)').matches ||
             window.matchMedia('(display-mode: standalone)').matches ||
             navigator.standalone === true;
    } catch(e){ return false; }
  }
  function pantallaCompleta(){
    if (esAppInstalada()) return;   // ya viene en pantalla completa: no pedir nada
    const el = document.documentElement;
    const f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f && !document.fullscreenElement) { try { f.call(el, { navigationUI:'hide' }); } catch(e){ try { f.call(el); } catch(_){} } }
  }
  let wakeLock = null;
  async function mantenerEncendida(){
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !wakeLock) mantenerEncendida();
  });

  /* ---------- Batería (solo estética) ---------- */
  function pintarBateria(nivel, cargando){
    const pct = Math.round(nivel * 100);
    $('#bateriaTexto').textContent = pct + '%';
    $('#bateriaNivel').setAttribute('width', String(Math.max(1.2, 15.9 * nivel).toFixed(1)));
    if (cargando) $('#bateriaTexto').textContent = pct + '%';
  }
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      pintarBateria(b.level, b.charging);
      b.addEventListener('levelchange', () => pintarBateria(b.level, b.charging));
    }).catch(()=>{});
  }

  /* ---------- 1. Rejilla invisible 3x3 (teclado telefónico) ---------- */
  const rejilla = $('#rejilla');
  for (let n = 1; n <= 9; n++) {
    const celda = document.createElement('div');
    celda.dataset.n = n;
    rejilla.appendChild(celda);
  }
  if (CONFIG.rejillaPantallaCompleta) rejilla.style.height = '100%';

  preparar.addEventListener('pointerdown', e => {
    e.preventDefault();
    pantallaCompleta();
    mantenerEncendida();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch(err){} }
    preparar.classList.remove('visible');
    apagada.classList.add('visible');
    activoDesde = Date.now() + 500;
  }, { passive:false });

  rejilla.addEventListener('pointerdown', e => {
    const celda = e.target.closest('[data-n]');
    if (!celda || Date.now() < activoDesde) return;
    e.preventDefault();
    elegir(parseInt(celda.dataset.n, 10));
  }, { passive:false });

  function elegir(n){
    minutosElegidos = n;
    desfaseMs = -n * 60000;   // el reloj arranca adelantado n minutos
    yaDisparado = false;
    animando = false;
    if (navigator.vibrate) { try { navigator.vibrate(CONFIG.vibracionConfirmacion); } catch(e){} }
    pantallaCompleta();
    mantenerEncendida();
    apagada.classList.remove('visible');
    bloqueo.classList.add('visible');
    iniciarTick();
    if (depurar) console.log('Minutos cargados:', n);
  }

  /* ---------- 3. Disparo del retroceso ---------- */
  const dormir = ms => new Promise(r => setTimeout(r, ms));
  function vibrar(){ if (navigator.vibrate) { try { navigator.vibrate(CONFIG.vibracion); } catch(e){} } }

  $('#zonaTruco').addEventListener('pointerdown', e => {
    e.preventDefault();
    pantallaCompleta();
    retroceder();
  }, { passive:false });

  async function retroceder(){
    if (animando || yaDisparado || minutosElegidos <= 0) return;
    animando = true;
    yaDisparado = true;
    const base = Date.now();
    await dormir(CONFIG.pausaAntesDeEmpezar);
    for (let k = 1; k <= minutosElegidos; k++) {
      pintar(new Date(base + (minutosElegidos - k) * 60000));
      vibrar();
      if (k < minutosElegidos) await dormir(CONFIG.msPorMinuto);
    }
    desfaseMs = 0;   // aterriza en la hora real y sigue latiendo con ella
    animando = false;
  }

  /* ---------- 4. Reinicio: deslizar hacia abajo con dos dedos ---------- */
  let inicioDosDedos = null;
  document.addEventListener('touchstart', e => {
    inicioDosDedos = e.touches.length === 2
      ? (e.touches[0].clientY + e.touches[1].clientY) / 2
      : null;
  }, { passive:true });

  document.addEventListener('touchmove', e => {
    if (inicioDosDedos === null || e.touches.length !== 2) return;
    const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if (y - inicioDosDedos > 110) { inicioDosDedos = null; reiniciar(); }
  }, { passive:true });

  document.addEventListener('touchend', () => { inicioDosDedos = null; }, { passive:true });

  // Salida de emergencia: mantener pulsada la esquina inferior izquierda 1,5 s
  let temporizadorEsquina = null;
  document.addEventListener('pointerdown', e => {
    if (e.clientX < 60 && e.clientY > innerHeight - 60) {
      temporizadorEsquina = setTimeout(reiniciar, 1500);
    }
  });
  ['pointerup','pointercancel','pointermove'].forEach(ev =>
    document.addEventListener(ev, () => { clearTimeout(temporizadorEsquina); }));

  function reiniciar(){
    animando = false;
    yaDisparado = false;
    detenerTick();
    minutosElegidos = 0;
    desfaseMs = 0;
    bloqueo.classList.remove('visible');
    apagada.classList.add('visible');
    activoDesde = Date.now() + 500;
    if (navigator.vibrate) { try { navigator.vibrate([12,60,12]); } catch(e){} }
  }

  /* ---------- Estorbos fuera ---------- */
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  /* ---------- Service worker: la app abre sin internet ---------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  iniciarTick();
})();
</script>
</body>
</html>
